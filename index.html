<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E2A22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kaspace CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>kaspace CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: фирменный стиль kaspace — графитово-зелёная панель с логотипом слева, светлый шалфейный холст, скруглённые «таблетки» и крупные карточки как на сайте; карточка клиента выезжает справа */
:root{
  --bg:#E6EBE0; --canvas:#E6EBE0; --surface:#F4F6F1; --surface-2:#DDE3D6; --line:#C9D1C3; --line-2:#B4BEAD;
  --fg:#1E2A22; --ink-2:#4A564C; --muted:#5F6B60; --faint:#859083;
  --accent:#5E8C61; --accent-ink:#F4F6F1; --accent-soft:#D3E0CF; --brand:#8DBB8F; --brand-hover:#7DAE80; --brand-ink:#1E2A22;
  --side:#1E2A22; --side-2:#26352B; --side-line:#3A4A3F; --side-fg:#E6EBE0; --side-muted:#A3B0A5;
  --danger:#B5493C; --danger-soft:#F1DCD6; --warn:#9A6B14; --warn-soft:#EFE4C8; --ok:#3F7A4B; --ok-soft:#D3E4D1;
  --shadow-sm:0 1px 2px rgba(30,42,34,.06);
  --shadow:0 1px 2px rgba(30,42,34,.05),0 10px 24px -10px rgba(30,42,34,.18);
  --shadow-lg:0 30px 70px -16px rgba(15,23,18,.35);
  --overlay:rgba(15,23,18,.45);
  --s-lead:#8A968B; --s-contact:#5F97A8; --s-brief:#8A80B4; --s-proposal:#C4974A; --s-negotiation:#C47650;
  --s-prepaid:#3F8F86; --s-work:#5E8C61; --s-review:#A47599; --s-paid:#2F7A45; --s-pause:#A2AAA0; --s-lost:#B5493C;
  --c-tg:#3C97C4; --c-wa:#3E9C5C; --c-ig:#C2557F; --c-vk:#4E78BE; --c-mail:#7E70B8; --c-call:#C47A3F; --c-meet:#A88A3A; --c-in:#3F6E9E; --c-be:#3D63B8; --c-web:#3E8F86; --c-ref:#5E8C61; --c-etc:#8A968B;
  --av1:#5E8C61; --av2:#C47650; --av3:#5F97A8; --av4:#8A80B4; --av5:#C4974A; --av6:#A47599; --av7:#3F6B4A; --av8:#4A564C;
  --f-display:'Unbounded','Arial Black',sans-serif;
  --f-body:'Space Grotesk','Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Space Grotesk','Onest',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16201A; --canvas:#16201A; --surface:#1E2A22; --surface-2:#26352B; --line:#33443A; --line-2:#44574B;
  --fg:#E6EBE0; --ink-2:#C4CEC5; --muted:#A3B0A5; --faint:#76857A;
  --accent:#8DBB8F; --accent-ink:#16201A; --accent-soft:#2A3D30;
  --side:#0F1712; --side-2:#1A251E; --side-line:#2A3830;
  --danger:#E58A7C; --danger-soft:#3A221E; --warn:#DDB563; --warn-soft:#352C17; --ok:#8DBB8F; --ok-soft:#22362A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -10px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -16px rgba(0,0,0,.75);
  --overlay:rgba(5,9,7,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16201A; --canvas:#16201A; --surface:#1E2A22; --surface-2:#26352B; --line:#33443A; --line-2:#44574B;
  --fg:#E6EBE0; --ink-2:#C4CEC5; --muted:#A3B0A5; --faint:#76857A;
  --accent:#8DBB8F; --accent-ink:#16201A; --accent-soft:#2A3D30;
  --side:#0F1712; --side-2:#1A251E; --side-line:#2A3830;
  --danger:#E58A7C; --danger-soft:#3A221E; --warn:#DDB563; --warn-soft:#352C17; --ok:#8DBB8F; --ok-soft:#22362A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35); --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 26px -10px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -16px rgba(0,0,0,.75);
  --overlay:rgba(5,9,7,.65); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums}

/* логотип kaspace */
@keyframes kasBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.kicon{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:#5E8C61;color:#E6EBE0;font:700 25px/1 var(--f-display)}
.kicon .k{display:inline-flex;align-items:baseline;line-height:1}
.kicon .bar{display:inline-block;width:.2em;height:.72em;margin-left:.06em;margin-bottom:-.1em;background:currentColor}
.kword{display:inline-flex;align-items:baseline;font:600 21px/1 var(--f-display);letter-spacing:-.02em;color:var(--side-fg)}
.kword .s{color:var(--brand)}
.kword .wc{display:inline-block;width:.36em;height:.78em;margin-left:.14em;background:var(--brand)}
.ktag{display:block;font:500 12px/1 'Space Grotesk',monospace;letter-spacing:.12em;color:var(--side-muted);margin-top:7px}
@media (prefers-reduced-motion:no-preference){.cur{animation:kasBlink 1.06s steps(1) infinite}}
.sub{color:var(--muted);font-size:13px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}

/* ---- боковая панель ---- */
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;padding:22px 14px 16px;gap:6px;min-height:0}
.brand{display:flex;align-items:center;gap:13px;padding:0 6px 26px}
.nav-label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:4px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:11px 14px;border-radius:999px;text-align:left;color:var(--side-muted);font-weight:500;font-size:14.5px;position:relative;transition:background .15s,color .15s}
.nav button:hover{background:var(--side-2);color:var(--side-fg)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:700}
.nav button[aria-current="page"] svg{color:var(--brand-ink)}
.nav svg{width:19px;height:19px;flex:none}
.nav .badge{margin-left:auto;background:var(--danger);color:#fff;font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:20px}
.nav .badge[data-zero]{display:none}
.today-box{margin:18px 4px 0;padding:16px;border-radius:20px;background:var(--side-2);border:1px solid var(--side-line)}
.today-box .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted)}
.today-box .v{font:600 22px/1.2 var(--f-mono);margin-top:6px;font-variant-numeric:tabular-nums}
.today-box .s{font-size:12px;color:var(--side-muted);margin-top:2px}
.today-box .meter{height:5px;border-radius:3px;background:var(--side-line);margin-top:10px;overflow:hidden}
.today-box .meter span{display:block;height:100%;background:var(--brand);border-radius:3px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:12px 4px 0;border-top:1px solid var(--side-line)}
.side-foot label{font-size:13px;color:var(--side-muted);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px}
.side-foot select{background:var(--side-2);border:1px solid var(--side-line);color:var(--side-fg);border-radius:7px;padding:4px 6px;color-scheme:dark}
.linkbtn{border:0;background:none;color:var(--side-muted);font-size:13px;padding:6px 8px;text-align:left;border-radius:7px;display:flex;gap:9px;align-items:center}
.linkbtn svg{width:15px;height:15px}
.linkbtn:hover{color:var(--side-fg);background:var(--side-2)}
.store-state{font-size:11.5px;color:var(--side-muted);display:flex;align-items:center;gap:7px;padding:8px 8px 0}
.store-state::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--side-muted)}
.store-state[data-mode="db"]::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.store-state[data-mode="local"]::before{background:var(--warn)}

/* ---- рабочая зона ---- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--canvas)}
.top{display:flex;align-items:flex-end;gap:16px;padding:26px 32px 18px;flex-wrap:wrap}
.hello{margin-right:auto;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top h1{font:600 30px/1.15 var(--f-display);margin:8px 0 0;letter-spacing:-.025em;text-wrap:balance}
.top h1 em{font-style:normal;color:var(--accent)}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sum-chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:5px 11px 5px 9px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.sum-chip b{color:var(--fg);font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.sum-chip i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--accent))}
.sum-chip[data-s="over"]{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.sum-chip[data-s="over"] b{color:var(--danger)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;width:300px;max-width:100%}
.search input{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:11px 42px 11px 40px}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%)}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap;transition:border-color .15s,background .15s,color .15s,transform .1s}
.btn:hover{border-color:var(--fg)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);padding:12px 22px;font-weight:700}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.small{padding:5px 12px;font-size:13px;border-width:1.5px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,transparent);background:none}
.btn.danger:hover{background:var(--danger-soft)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:var(--ok-soft)}
kbd{font:500 11px/1 var(--f-mono);border:1px solid currentColor;border-radius:5px;padding:2px 5px;opacity:.55}
.btn.primary kbd{opacity:.7}

.filters{display:flex;gap:8px;padding:0 32px 14px;flex-wrap:wrap;align-items:center}
.sel{position:relative}
.filters select{appearance:none;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 32px 7px 15px;font-size:13.5px;font-weight:600;color:var(--fg)}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:6px;height:6px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--muted)}
.filters select.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.filters .count{font-size:12.5px;color:var(--muted);margin-left:auto}
.banner{margin:0 32px 14px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.banner b{color:var(--warn)}
.banner .btn{margin-left:auto}
.view{flex:1;min-height:0;overflow:auto;padding:4px 32px 36px}

/* ---- аватары и значки ---- */
.av{--avc:var(--av1);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 11.5px/1 var(--f-body);color:var(--avc);background:color-mix(in srgb,var(--avc) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--avc) 28%,transparent);letter-spacing:.02em}
.av.lg{width:56px;height:56px;font:600 19px/1 var(--f-display);border-radius:16px}
.chn{--cc:var(--c-etc);display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--cc);white-space:nowrap}
.chn i{font:700 9.5px/1 var(--f-mono);font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--cc) 15%,var(--surface));letter-spacing:-.02em}
.chip{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.ex{background:var(--warn-soft);color:var(--warn)}
.due{display:inline-flex;align-items:center;gap:5px;font:500 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.due::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.due[data-s="over"]{background:var(--danger-soft);color:var(--danger)}
.due[data-s="today"]{background:var(--warn-soft);color:var(--warn)}
.due[data-s="soon"]{background:var(--accent-soft);color:var(--accent)}
.due[data-s="none"]{background:none;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--faint)}
.stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;padding:4px 9px;border-radius:20px;color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,var(--surface))}
.stage-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}

/* ---- воронка ---- */
.board{display:flex;gap:14px;align-items:flex-start;min-height:100%;overflow-x:auto;padding:2px 2px 14px}
.col{flex:0 0 284px;background:color-mix(in srgb,var(--sc) 7%,var(--surface));border:1px solid color-mix(in srgb,var(--sc) 18%,var(--line));border-radius:24px;display:flex;flex-direction:column;max-height:100%;transition:outline-color .15s}
.col-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.col-head .t{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.col-head .t::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--sc);flex:none}
.col-head .t span{margin-left:auto;font:600 11.5px/1 var(--f-mono);padding:4px 7px;border-radius:20px;background:var(--surface);color:var(--muted)}
.col-head .sum{font:500 12.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.col-head .track{height:4px;border-radius:2px;background:color-mix(in srgb,var(--sc) 14%,transparent);overflow:hidden}
.col-head .track span{display:block;height:100%;background:var(--sc);border-radius:2px}
.col-body{padding:2px 10px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;min-height:70px}
.col.drop{outline:2px dashed var(--sc);outline-offset:-3px}
.col-empty{font-size:12.5px;color:var(--faint);text-align:center;padding:18px 6px;border:1.5px dashed color-mix(in srgb,var(--sc) 25%,var(--line));border-radius:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow-sm);transition:box-shadow .18s,transform .18s,border-color .18s;position:relative}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px);border-color:var(--line-2)}
.card.dragging{opacity:.4;transform:rotate(-2deg)}
.card .hd{display:flex;gap:10px;align-items:center;min-width:0}
.card .nm{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.card .co{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px}
.card .foot{display:flex;justify-content:space-between;gap:6px;align-items:center;padding-top:9px;border-top:1px dashed var(--line)}
.card .money{font:600 13px var(--f-mono);font-variant-numeric:tabular-nums}
.card .hot{position:absolute;top:10px;right:10px;font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--danger);background:var(--danger-soft);padding:3px 6px;border-radius:5px}

/* ---- таблица ---- */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:880px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--surface-2)}
th:first-child{padding-left:20px}
th[data-sort]{color:var(--accent)}
th[data-sort]::after{content:" ↓"}
th[data-sort="asc"]::after{content:" ↑"}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td:first-child{padding-left:20px}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover td{background:var(--surface-2)}
.who-cell{display:flex;gap:11px;align-items:center}
.who-cell b{font-weight:600}

/* ---- задачи ---- */
.tasks{display:flex;flex-direction:column;gap:26px;max-width:940px}
.group h2{font:600 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;display:flex;gap:9px;align-items:center}
.group h2 span{font-family:var(--f-mono);padding:3px 7px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.group[data-g="over"] h2{color:var(--danger)}
.group[data-g="today"] h2{color:var(--warn)}
.task-list{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-sm)}
.task{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--surface-2)}
.task .who{cursor:pointer;min-width:0}
.task .who b{font-weight:600}
.task .who .act{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.task .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}

/* ---- сводка ---- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:4px}
.kpi .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,var(--surface));margin-bottom:10px}
.kpi .ic svg{width:18px;height:18px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:600 24px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--side);border-color:var(--side);color:var(--side-fg)}
.kpi.hero .l,.kpi.hero .s{color:var(--side-muted)}
.kpi.hero .ic{background:var(--side-2);color:var(--brand)}
.kpi.hero .v{color:var(--brand)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow-sm)}
.panel h3{margin:0 0 4px;font:600 16px var(--f-display);letter-spacing:-.01em}
.panel .ph{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:140px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:13px}
.bar .lb{display:flex;align-items:center;gap:8px;min-width:0}
.bar .lb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;display:flex}

.bar .f2{height:100%;background:var(--bc,var(--ok))}
.bar .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--fg)}
.legend i.a{opacity:.3}
.funnel{display:flex;flex-direction:column;gap:6px}
.fn{display:grid;grid-template-columns:150px minmax(0,1fr) 30px;gap:12px;align-items:center;font-size:13px}
.fn .tr{height:22px;display:flex;justify-content:center}
.fn .f{height:100%;border-radius:6px;background:var(--sc);min-width:4px}
.fn .n{text-align:right;font-family:var(--f-mono);color:var(--muted)}

.empty{max-width:460px;margin:60px auto;text-align:center;color:var(--muted)}
.empty .art{width:84px;height:84px;margin:0 auto 18px;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.empty .art svg{width:38px;height:38px}
.empty h2{font:600 20px var(--f-display);color:var(--fg);margin:0 0 8px;letter-spacing:-.02em}

/* ---- карточка клиента ---- */
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:20;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--canvas);z-index:21;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{padding:22px 24px 18px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.d-id{display:flex;gap:14px;align-items:center}
.d-id .names{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d-head input.title{font:600 21px/1.2 var(--f-display);border:0;background:none;padding:2px 0;width:100%;letter-spacing:-.02em;border-radius:4px}
.d-head input.subtitle{border:0;background:none;color:var(--muted);padding:0;width:100%;border-radius:4px}
.d-head input.title:focus,.d-head input.subtitle:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.progress{display:flex;gap:3px}
.progress span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress span.on{background:var(--pc)}
.stages{display:flex;gap:5px;flex-wrap:wrap}
.stages button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;transition:all .15s}
.stages button:hover{border-color:var(--sc);color:var(--fg)}
.stages button::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc)}
.stages button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:700}
.d-body{flex:1;overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.sec h4{margin:0;font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h4 svg{width:15px;height:15px;color:var(--accent)}
.sec.next{background:var(--side);border-color:var(--side);color:var(--side-fg)}
.sec.next h4{color:var(--side-muted)}
.sec.next h4 svg{color:var(--brand)}
.sec.next .fld>span{color:var(--side-muted)}
.sec.next .fld input{background:var(--side-2);border-color:var(--side-line);color:var(--side-fg);color-scheme:dark}
.sec.next .btn{background:none;border-color:var(--side-line);color:var(--side-fg)}
.sec.next .btn:hover{border-color:var(--brand);color:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.inp,.fld input,.fld select,.fld textarea{background:var(--canvas);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
.fld textarea{resize:vertical;min-height:80px}
.inp:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.handles{display:flex;flex-direction:column;gap:8px}
.handle{display:grid;grid-template-columns:28px 86px minmax(0,1fr) auto;gap:8px;align-items:center}
.handle>span{font-size:13px;color:var(--muted)}
.handle .chn i{width:26px;height:26px;border-radius:8px;font-size:10px}
.handle .ha{display:flex;gap:2px}
.icon-btn{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);text-decoration:none}
.icon-btn:hover{background:var(--surface-2);color:var(--accent)}
.icon-btn[aria-disabled="true"]{opacity:.25;pointer-events:none}
.icon-btn svg{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);transition:all .15s}
.chips button:hover{border-color:var(--fg);color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:700}
.quick{display:flex;gap:4px;flex-wrap:wrap}
.composer{display:flex;flex-direction:column;gap:8px;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:12px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.composer textarea{border:0;background:none;resize:vertical;min-height:56px;padding:2px}
.composer textarea:focus{outline:none}
.composer .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.composer select{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:13px}
.composer .hint{font-size:11.5px;color:var(--faint);margin-left:auto}
.timeline{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:9px 0;position:relative}
.timeline li::before{content:"";position:absolute;left:13.5px;top:36px;bottom:-9px;width:1px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.timeline .dot svg{width:14px;height:14px}
.timeline li.sys .dot{background:var(--surface-2);color:var(--muted)}
.timeline .h{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:28px}
.timeline .h b{color:var(--fg);font-weight:600;font-size:13px}
.timeline .x{margin-left:auto;border:0;background:none;color:var(--faint);font-size:12px;opacity:0;border-radius:5px;padding:2px 6px}
.timeline .x:hover{color:var(--danger);background:var(--danger-soft)}
.timeline li:hover .x,.timeline .x:focus{opacity:1}
.timeline .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;margin-top:2px;background:var(--canvas);border-radius:10px;padding:9px 11px}
.timeline li.sys .tx{color:var(--muted);font-size:13px;background:none;padding:0}
.d-foot{padding:12px 24px;border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.d-foot .sp{margin-left:auto}

.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:var(--overlay);backdrop-filter:blur(3px)}
.modal form,.modal .box{background:var(--surface);border-radius:28px;box-shadow:var(--shadow-lg);width:min(580px,100%);max-height:100%;overflow:auto;padding:30px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font:600 22px var(--f-display);letter-spacing:-.02em}
.modal h3 em{font-style:normal;color:var(--accent)}
.modal .lead{margin:-8px 0 2px;color:var(--muted);font-size:13.5px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.modal textarea.dump{min-height:200px;font:12px var(--f-mono)}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--side);color:var(--side-fg);padding:11px 18px;border-radius:12px;font-size:14px;z-index:40;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);display:flex;gap:9px;align-items:center}
.toast{border-radius:999px;padding:12px 22px}
.toast::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--brand)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{order:2;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .brand,.side-foot,.today-box,.nav-label{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 10px}
  .nav button[aria-current="page"]::before{left:30%;right:30%;top:-6px;bottom:auto;height:3px;width:auto;border-radius:0 0 3px 3px}
  .nav .badge{position:absolute;top:2px;right:6px;margin:0}
  .top{padding:18px 16px 14px}
  .top h1{font-size:22px}
  .tools{width:100%}
  .search{flex:1;width:auto}
  .search kbd{display:none}
  .btn.primary kbd{display:none}
  .filters,.view{padding-left:16px;padding-right:16px}
  .banner{margin-left:16px;margin-right:16px}
  .col{flex-basis:256px}
  .task{grid-template-columns:30px minmax(0,1fr)}
  .task .due-cell,.task .acts{grid-column:2}
  .task .acts{justify-content:flex-start}
  .grid2{grid-template-columns:1fr}
  .bar{grid-template-columns:100px minmax(0,1fr) 30px}
  .fn{grid-template-columns:110px minmax(0,1fr) 26px}
  .handle{grid-template-columns:28px minmax(0,1fr) auto}
  .handle>span{display:none}
  .d-body{padding:12px 12px 24px}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
  .modal form,.modal .box{animation:pop .2s cubic-bezier(.2,.8,.2,1)}
  @keyframes slide{from{transform:translateX(40px);opacity:.5}}
  @keyframes pop{from{transform:scale(.97);opacity:.6}}
}
/* предоплата */

@media (max-width:760px){.grid3{grid-template-columns:1fr 1fr}.grid3 .fld:last-child{grid-column:1/-1}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

};
const LOG_ICON = {'Комментарий':'chat','Переписка':'chat','Звонок':'phone','Встреча':'people','Отправил КП':'doc','Отправил материалы':'doc','Оплата':'coin','Этап':'stage'};

// ---------- состояние ----------
let contacts = new Map();

let view = 'board';

// ---------- утилиты ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (n, from) => { const d = from ? new Date(from+'T12:00') : new Date(); d.setDate(d.getDate()+n); return ymd(d); };
const dayDiff = s => Math.round((new Date(s+'T12:00') - new Date(today()+'T12:00'))/864e5);
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const MONTHS_FULL = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const fmtDay = s => { const d = new Date(s+'T12:00'); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; };
function plural(n, a, b, c){ const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }
function dueLabel(s){
  if (!s) return {t:'нет шага', s:'none'};
  const n = dayDiff(s);
  if (n < 0) return {t: n===-1 ? 'вчера' : `−${-n} дн.`, s:'over'};
  if (n === 0) return {t:'сегодня', s:'today'};
  if (n === 1) return {t:'завтра', s:'soon'};
  return {t: fmtDay(s), s:'later'};
}
function ago(iso){
  if (!iso) return '—';
  const d = new Date(iso), n = dayDiff(ymd(d));
  if (n === 0) return 'сегодня, ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (n === -1) return 'вчера';
  if (n > -7) return `${-n} дн. назад`;
  return fmtDay(ymd(d)) + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
const money = n => (Number(n)||0) ? new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ' + settings.currency : '—';
const moneyZ = n => new Intl.NumberFormat('ru-RU').format(Math.round(Number(n)||0)) + ' ' + settings.currency;
function initials(c){
  const src = (c.name || c.company || '?').trim().split(/\s+/);
  return ((src[0]||'')[0] + ((src[1]||'')[0] || '')).toUpperCase() || '?';
}
function avColor(c){ let h = 0; for (const ch of (c.name || c.id || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return `var(--av${h % 8 + 1})`; }
const avatar = (c, lg) => `<span class="av${lg ? ' lg' : ''}" style="--avc:${avColor(c)}">${esc(initials(c))}</span>`;
function chn(name, withText){ const m = CH[name] || CH['Другое']; return `<span class="chn" style="--cc:var(--c-${m[1]})" title="${esc(name)}"><i>${esc(m[0])}</i>${withText ? esc(name) : ''}</span>`; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role','status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function linkFor(k, v){
  v = String(v||'').trim(); if (!v) return '';
  const h = v.replace(/^@/,'').replace(/^https?:\/\/(www\.)?(t\.me|instagram\.com|vk\.com)\//i,'');
  if (k==='telegram') return 'https://t.me/' + encodeURIComponent(h);
  if (k==='instagram') return 'https://instagram.com/' + encodeURIComponent(h);
  if (k==='vk') return 'https://vk.com/' + encodeURIComponent(h);
  if (k==='whatsapp') { const d = v.replace(/\D/g,''); return d ? 'https://wa.me/' + d : ''; }
  if (k==='website') return /^https?:\/\//i.test(v) ? v : 'https://' + v;
  return '';
}
async function copy(text, inputEl){
  try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
  catch(e){ if (inputEl){ inputEl.focus(); inputEl.select(); } toast('Выделил текст — нажмите Ctrl+C'); }
}
function blank(){
  const now = new Date().toISOString();
  return {name:'', company:'', position:'', channel:'Telegram', services:[], stage:'lead', budget:0, prepay:0, prepayAt:'', priority:'normal',
    tags:[], nextDate:'', nextAction:'', notes:'', links:{}, log:[], createdAt:now, updatedAt:now, lastContactAt:'', stageAt:now};
}
function norm(c){ const b = blank(); return {...b, ...c, links:{...(c.links||{})}, services:[...(c.services||[])], tags:[...(c.tags||[])], log:[...(c.log||[])]}; }

// ---------- хранилище: Firebase Firestore, путь users/<uid>/... ----------
const configured = !!(firebaseConfig && firebaseConfig.apiKey && !/ВСТАВЬТЕ/.test(firebaseConfig.apiKey));
let fbApp = null, auth = null, fdb = null;
const clean = o => JSON.parse(JSON.stringify(o));
const store = {
  mode:'loading', uid:null, unsubs:[],
  timers:new Map(), writing:new Map(),
  col(){ return collection(fdb, 'users', this.uid, 'contacts'); },
  start(uid){
    this.uid = uid; this.mode = 'db';
    setStoreState('loading', 'Подключаюсь к базе…');
    this.unsubs.push(onSnapshot(this.col(), {includeMetadataChanges:true}, snap => {
      if (!navigator.onLine) setStoreState('offline', 'Офлайн: сохраню при подключении');
      else setStoreState('db', snap.metadata.hasPendingWrites ? 'Сохраняю…' : 'Сохранено в облаке');
      onRemote(snap.docs.map(d => ({...d.data(), id:d.id})));
    }, err => {
      setStoreState('offline', 'Нет доступа к базе');
      toast(err.code === 'permission-denied' ? 'Нет доступа: проверьте правила Firestore и email владельца' : 'Ошибка базы: ' + err.code);
    }));
    this.unsubs.push(onSnapshot(doc(fdb, 'users', uid, 'meta', 'settings'), s => {
      if (s.exists()){ settings = {...settings, ...s.data()}; $('#currency').value = settings.currency; renderAll(); }
    }, () => {}));
  },
  stop(){
    this.unsubs.forEach(u => u()); this.unsubs = [];
    this.uid = null; contacts = new Map(); loaded = false; closeDrawer();
  },
  pending(id){ return this.timers.has(id) || (this.writing.get(id)||{}).busy; },
  saveSoon(id, delay=500){
    clearTimeout(this.timers.get(id));
    this.timers.set(id, setTimeout(() => { this.timers.delete(id); this.flush(id); }, delay));
  },
  async flush(id){
    if (!this.uid) return;
    const w = this.writing.get(id) || {busy:false, again:false}; this.writing.set(id, w);
    if (w.busy){ w.again = true; return; }
    w.busy = true;
    try {
      do {
        w.again = false;
        const c = contacts.get(id);
        if (c){ const {id:_, ...body} = c; await setDoc(doc(this.col(), id), clean(body)); }
      } while (w.again);
    } catch(e){
      toast(e && e.code === 'permission-denied' ? 'Нет прав на запись: проверьте правила Firestore' : 'Не удалось сохранить, пробую ещё раз');
      if (!e || e.code === 'unavailable') setTimeout(() => this.saveSoon(id, 0), 1500 + Math.random()*1000);
    } finally { w.busy = false; }
  },
  async remove(id){
    clearTimeout(this.timers.get(id)); this.timers.delete(id);
    contacts.delete(id);
    try { await deleteDoc(doc(this.col(), id)); } catch(e){ toast('Не удалось удалить'); }
  },
  async saveSettings(){
    if (this.uid) try { await setDoc(doc(fdb, 'users', this.uid, 'meta', 'settings'), clean(settings)); } catch(e){}
  }
};
function setStoreState(mode, text){ const el = $('#storeState'); el.dataset.mode = mode; el.textContent = text; }
window.addEventListener('offline', () => setStoreState('offline', 'Офлайн: сохраню при подключении'));

// ---------- вход по логину и паролю ----------
// Firebase входит по email, поэтому логин превращается во внутренний адрес проекта.
// Письма на него не отправляются, пользователь видит только логин.
const LOGIN_DOMAIN = '@' + firebaseConfig.authDomain;
const loginToEmail = login => login.trim().toLowerCase().replace(/\s+/g, '') + LOGIN_DOMAIN;
const emailToLogin = email => (email || '').endsWith(LOGIN_DOMAIN) ? email.slice(0, -LOGIN_DOMAIN.length) : (email || '');
let gateError = '';
function showGate(text, withActions, err){
  $('#gate').hidden = false; $('#app').hidden = true;
  $('#gateText').textContent = text;
  $('#gateActions').hidden = !withActions;
  $('#gateErr').textContent = err || '';
}
function authMsg(e){
  const c = e && e.code || '';
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email') return 'Неверный логин или пароль.';
  if (c === 'auth/user-disabled') return 'Этот аккаунт отключён.';
  if (c === 'auth/too-many-requests') return 'Слишком много попыток. Подождите несколько минут.';
  if (c === 'auth/network-request-failed') return 'Нет интернета. Проверьте подключение.';
  return 'Не удалось войти (' + c + ').';
}
function boot(){
  if (!configured){ showGate('CRM ещё не подключена к базе.', false); return; }
  fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  try { fdb = initializeFirestore(fbApp, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e){ fdb = initializeFirestore(fbApp, {}); }
  onAuthStateChanged(auth, user => {
    if (!user){ store.stop(); showGate('Введите логин и пароль.', true, gateError); gateError = ''; return; }
    if (OWNER_UID && user.uid !== OWNER_UID){
      gateError = 'У этого аккаунта нет доступа к CRM.';
      signOut(auth); return;
    }
    $('#gate').hidden = true; $('#app').hidden = false;
    $('#accountEmail').textContent = emailToLogin(user.email);
    store.start(user.uid);
    renderAll();
  });
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault(); $('#gateErr').textContent = '';
    const login = $('#loginName').value;
    if (!login.trim()) return;
    try { await signInWithEmailAndPassword(auth, loginToEmail(login), $('#loginPass').value); }
    catch(err){ $('#gateErr').textContent = authMsg(err); }
  });
  $('#logoutBtn').addEventListener('click', () => signOut(auth));
  $('#passBtn').addEventListener('click', openPassword);
}
function openPassword(){
  const user = auth && auth.currentUser; if (!user) return;
  $('#modalSlot').innerHTML = `<div class="modal" data-act="closeModal"><form id="passForm" autocomplete="off">
    <h3>Сменить <em>пароль</em></h3>
    <p class="lead">Логин: <b>${esc(emailToLogin(user.email))}</b>. Новый пароль будет действовать на всех устройствах.</p>
    <label class="fld"><span>Текущий пароль</span><input type="password" id="p0" autocomplete="current-password" required></label>
    <label class="fld"><span>Новый пароль (минимум 8 символов)</span><input type="password" id="p1" autocomplete="new-password" minlength="8" required></label>
    <label class="fld"><span>Повторите новый пароль</span><input type="password" id="p2" autocomplete="new-password" minlength="8" required></label>
    <div class="sub" id="passErr" role="alert"></div>
    <div class="acts"><button type="button" class="btn" data-act="closeModal">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div>
  </form></div>`;
  setTimeout(() => $('#p0').focus(), 0);
}
document.addEventListener('submit', async e => {
  if (e.target.id !== 'passForm') return;
  e.preventDefault();
  const p0 = $('#p0').value, p1 = $('#p1').value, p2 = $('#p2').value, err = $('#passErr');
  if (p1.length < 8) { err.textContent = 'Пароль должен быть не короче 8 символов.'; return; }
  if (p1 !== p2) { err.textContent = 'Новые пароли не совпадают.'; return; }
  const user = auth.currentUser;
  try {
    await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, p0));
    await updatePassword(user, p1);
    closeModal(); toast('Пароль изменён');
  } catch(x){
    err.textContent = x.code === 'auth/invalid-credential' || x.code === 'auth/wrong-password' ? 'Текущий пароль неверный.'
      : x.code === 'auth/weak-password' ? 'Слишком простой пароль, придумайте сложнее.'
      : x.code === 'auth/too-many-requests' ? 'Слишком много попыток. Подождите несколько минут.'
      : 'Не удалось сменить пароль (' + x.code + ').';
  }
});

function onRemote(list){
  const seen = new Set();
  let drawerChanged = false;
  for (const raw of list){
    seen.add(raw.id);
    if (store.pending(raw.id)) continue;
    const prev = contacts.get(raw.id);
    const next = norm(raw);
    if (raw.id === openId && prev && prev.updatedAt !== next.updatedAt) drawerChanged = true;
    contacts.set(raw.id, next);
  }
  for (const id of [...contacts.keys()]) if (!seen.has(id) && !store.pending(id)) contacts.delete(id);
  loaded = true;
  renderAll();
  if (openId && !contacts.has(openId)) closeDrawer();
  else if (drawerChanged && !$('#drawerSlot').contains(document.activeElement)) renderDrawer();
}

function touch(c){ c.updatedAt = new Date().toISOString(); }
function change(c, delay){ touch(c); store.saveSoon(c.id, delay); scheduleRender(); }
let rt = null;
function scheduleRender(){ clearTimeout(rt); rt = setTimeout(renderAll, 120); }

// ---------- фильтры ----------
function fillFilters(){
  $('#fService').innerHTML = '<option value="">Все услуги</option>' + SERVICES.map(s => `<option>${esc(s)}</option>`).join('');
  $('#fChannel').innerHTML = '<option value="">Все каналы</option>' + CHANNELS.map(s => `<option>${esc(s)}</option>`).join('');
  $('#fStage').innerHTML = '<option value="">Все этапы</option>' + STAGES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
}
function matches(c){
  if (filter.service && !c.services.includes(filter.service)) return false;
  if (filter.channel && c.channel !== filter.channel) return false;
  if (filter.stage && c.stage !== filter.stage) return false;
  if (filter.q){
    const hay = [c.name,c.company,c.position,c.notes,c.nextAction,c.phone,c.email,...c.tags,...Object.values(c.links)].join(' ').toLowerCase();
    if (!filter.q.toLowerCase().split(/\s+/).every(w => hay.includes(w.replace(/^@/,'')))) return false;
  }
  return true;
}
const filtered = () => [...contacts.values()].filter(matches);

const TITLES = {board:'Воронка <em>продаж</em>', list:'Все <em>контакты</em>', tasks:'Задачи и <em>напоминания</em>', stats:'Сводка <em>по студии</em>'};

}
// Деньги, пришедшие за месяц: предоплаты с датой в этом месяце + остатки по сделкам, оплаченным в этом месяце
function receivedIn(all, ym){
  const pre = all.filter(c => prepaidSum(c) && (c.prepayAt || '').slice(0,7) === ym);
  const fin = all.filter(c => c.stage === 'paid' && (c.paidAt || '').slice(0,7) === ym);
  const preSum = pre.reduce((s,c) => s + prepaidSum(c), 0);
  const finSum = fin.reduce((s,c) => s + restSum(c), 0);
  return {total: preSum + finSum, preSum, finSum, count: pre.length + fin.length};
}

function renderTasks(v){

function bars(rows, max, colorFn){

}
function renderStats(v){
  const all = [...contacts.values()];
  const act = all.filter(c => ACTIVE.has(c.stage));
  const sum = a => a.reduce((s,c) => s + (Number(c.budget)||0), 0);
  const inWork = all.filter(c => c.stage === 'work' || c.stage === 'review');
  const ym = today().slice(0,7);
  const got = receivedIn(all, ym);
  const holding = all.filter(c => c.stage !== 'paid' && prepaidSum(c)).sort((a,b) => (a.stage === 'pause' ? -1 : 0) - (b.stage === 'pause' ? -1 : 0) || prepaidSum(b) - prepaidSum(a));
  const paid = all.filter(c => c.stage === 'paid').length, lost = all.filter(c => c.stage === 'lost').length;
  const conv = paid + lost ? Math.round(paid/(paid+lost)*100) + '%' : '—';
  const avg = paid ? sum(all.filter(c => c.stage === 'paid'))/paid : 0;
  const byCh = CHANNELS.map(ch => ({label:ch, pre:chn(ch), key:(CH[ch]||CH['Другое'])[1], a:all.filter(c => c.channel === ch).length, b:all.filter(c => c.channel === ch && c.stage === 'paid').length})).filter(r => r.a).sort((x,y) => y.a - x.a);
  const bySv = SERVICES.map(s => ({label:s, a:all.filter(c => c.services.includes(s)).length, b:all.filter(c => c.services.includes(s) && c.stage === 'paid').length})).filter(r => r.a).sort((x,y) => y.a - x.a);
  const mx = r => Math.max(1, ...r.map(x => x.a));
  const st = STAGES.map(s => ({s, n:all.filter(c => c.stage === s.id).length}));
  const stMax = Math.max(1, ...st.map(x => x.n));
  const kpi = (cls, kc, ic, l, val, s) => `<div class="kpi ${cls}" style="--kc:${kc}"><span class="ic">${ICON[ic]}</span><div class="l">${l}</div><div class="v">${val}</div><div class="s">${s}</div></div>`;
  v.innerHTML = `<div class="kpis">
    ${kpi('hero','var(--accent)','pulse','В воронке', moneyZ(sum(act)), `${act.length} ${plural(act.length,'активная сделка','активные сделки','активных сделок')}`)}
    ${kpi('','var(--s-work)','case','В работе', moneyZ(sum(inWork)), `${inWork.length} ${plural(inWork.length,'проект','проекта','проектов')}, включая сданные`)}
    ${kpi('','var(--ok)','coin','Получено за месяц', moneyZ(got.total), `предоплаты ${moneyZ(got.preSum)} · средний чек ${avg ? moneyZ(avg) : '—'}`)}
    ${kpi('','var(--s-proposal)','target','Конверсия в оплату', conv, `${paid} оплачено / ${lost} ${plural(lost,'отказ','отказа','отказов')}`)}
  </div>
  <div class="panels">
    <div class="panel"><h3>Предоплаты на руках</h3><p class="ph">Клиенты, которые внесли предоплату, но ещё не оплатили всё. Пауза и отказ предоплату не сбрасывают</p>${holding.length ? `<div class="prepay-list">${holding.map(c => `<button class="pl-row" data-open="${c.id}">${avatar(c)}<span class="pl-who"><b>${esc(c.name || 'Без имени')}</b><span class="stage-pill" style="--sc:var(--s-${c.stage})">${esc(STAGE[c.stage].name)}</span></span><span class="pl-sum"><b>${moneyZ(prepaidSum(c))}</b>${restSum(c) ? `<span>остаток ${moneyZ(restSum(c))}</span>` : ''}</span></button>`).join('')}</div><div class="pl-total"><span>Всего предоплат</span><b>${moneyZ(holding.reduce((s,c) => s + prepaidSum(c), 0))}</b></div>` : '<p class="sub">Пока нет клиентов с предоплатой. Укажите сумму в карточке клиента, блок «Оплата».</p>'}</div>
    <div class="panel"><h3>Откуда приходят клиенты</h3><p class="ph">Какие соцсети и каналы реально приносят заказы</p>${byCh.length ? bars(byCh, mx(byCh), r => `var(--c-${r.key})`) : '<p class="sub">Нет данных</p>'}<div class="legend"><span><i></i>оплатили</span><span><i class="a"></i>остальные контакты</span></div></div>
    <div class="panel"><h3>Какие услуги запрашивают</h3><p class="ph">Что чаще всего нужно клиентам</p>${bySv.length ? bars(bySv, mx(bySv), () => 'var(--accent)') : '<p class="sub">Нет данных</p>'}<div class="legend"><span><i></i>оплачено</span><span><i class="a"></i>в процессе или отказ</span></div></div>
    <div class="panel"><h3>Воронка по этапам</h3><p class="ph">Где сейчас находятся ваши контакты</p><div class="funnel">${st.map(x => `<div class="fn" style="--sc:var(--s-${x.s.id})"><span>${esc(x.s.name)}</span><span class="tr"><span class="f" style="width:${x.n/stMax*100}%"></span></span><span class="n">${x.n}</span></div>`).join('')}</div></div>
  </div>`;
}

        <div class="grid3">
          <label class="fld"><span>Бюджет, ${esc(settings.currency)}</span><input id="f-budget" data-f="budget" inputmode="numeric" value="${c.budget || ''}" placeholder="0"></label>
          <label class="fld"><span>Предоплата, ${esc(settings.currency)}</span><input id="f-prepay" data-f="prepay" inputmode="numeric" value="${c.prepay || ''}" placeholder="0"></label>
          <label class="fld"><span>Дата предоплаты</span><input type="date" id="f-prepayAt" data-f="prepayAt" value="${esc(c.prepayAt)}"></label>
        </div>
        <div class="pay-row"><div class="quick"><button class="btn small" data-prepay="30">30%</button><button class="btn small" data-prepay="50">50%</button><button class="btn small" data-prepay="100">100%</button><button class="btn small ghost" data-prepay="0">Убрать</button></div><div class="pay-rest" id="payRest">${payRestHTML(c)}</div></div>
        <p class="pay-note">Предоплата сохраняется при любой смене этапа, в том числе при паузе и отказе.</p>
      </div>
      <div class="sec">
        <h4>${ICON.case}Сделка</h4>
        <div class="grid2">
          <label class="fld"><span>Откуда / где общаемся</span><select id="f-channel" data-f="channel">${opt(CHANNELS, c.channel)}</select></label>
          <label class="fld"><span>Должность / роль</span><input id="f-position" data-f="position" value="${esc(c.position)}" placeholder="Маркетолог, владелец…"></label>
          <label class="fld"><span>Приоритет</span><select id="f-priority" data-f="priority"><option value="low" ${c.priority==='low'?'selected':''}>Низкий</option><option value="normal" ${c.priority==='normal'?'selected':''}>Обычный</option><option value="high" ${c.priority==='high'?'selected':''}>Высокий</option></select></label>
        </div>
        <div class="fld"><span>Услуги</span><div class="chips" id="svcChips">${SERVICES.map(s => `<button data-svc="${esc(s)}" aria-pressed="${c.services.includes(s)}">${esc(s)}</button>`).join('')}</div></div>
        <label class="fld"><span>Теги через запятую</span><input id="f-tags" data-f="tags" value="${esc(c.tags.join(', '))}" placeholder="постоянный, рекомендация от Ани"></label>
        <label class="fld"><span>Заметки: ТЗ, ссылки на макеты и бриф</span><textarea id="f-notes" data-f="notes" rows="4">${esc(c.notes)}</textarea></label>
      </div>
    </div>
    <div class="d-foot"><span>Создан ${ago(c.createdAt)} · обновлён ${ago(c.updatedAt)}</span><span class="sp"></span><span id="delZone"><button class="btn small danger" data-act="askDel">Удалить</button></span></div>
  </aside>`;
}
function payRestHTML(c){
  const b = Number(c.budget) || 0, p = prepaidSum(c);
  if (c.stage === 'paid') return `<span class="ok">Оплачено полностью${b ? ': ' + moneyZ(b) : ''}</span>`;
  if (!b && !p) return '<span>Укажите бюджет и предоплату</span>';
  if (!p) return `<span>Предоплаты пока нет</span>`;
  return `Остаток к оплате: <b>${moneyZ(restSum(c))}</b>${b ? `<span class="pct">${Math.round(p / b * 100)}% внесено</span>` : ''}`;
}
function timelineHTML(c){
  if (!c.log.length) return '<li class="sys"><span class="dot">' + ICON.chat + '</span><div><div class="h"><b>Пока пусто</b></div><div class="tx">Записывайте сюда каждый разговор, и через месяц не придётся вспоминать, о чём договорились.</div></div></li>';
  return c.log.map(e => `<li class="${e.type==='Этап'?'sys':''}"><span class="dot">${ICON[LOG_ICON[e.type] || 'chat']}</span><div>
    <div class="h"><b>${esc(e.type === 'Этап' ? 'Смена этапа' : e.type)}</b>${e.channel && e.type!=='Этап' ? chn(e.channel, true) : ''}<span>${ago(e.at)}</span><button class="x" data-dellog="${e.id}">удалить</button></div>
    <div class="tx">${esc(e.text)}</div></div></li>`).join('');
}
function refreshDrawerParts(c){
  const t = $('#timeline'); if (t) t.innerHTML = timelineHTML(c);
  const p = $('#progress'); if (p) p.innerHTML = progressHTML(c);
  document.querySelectorAll('#stageBtns button').forEach(b => b.setAttribute('aria-pressed', b.dataset.stageSet === c.stage));
}
function logPrepay(c){
  c.log.unshift({id:uid(), at:new Date().toISOString(), type:'Оплата', channel:'', text:`Предоплата ${moneyZ(prepaidSum(c))}` + (Number(c.budget) ? `, остаток ${moneyZ(restSum(c))}` : '')});
  c.lastContactAt = c.log[0].at;
  const t = $('#timeline'); if (t) t.innerHTML = timelineHTML(c);
}
// запись в историю, когда сумму предоплаты ввели вручную и вышли из поля
document.addEventListener('change', e => {
  if (e.target.id !== 'f-prepay') return;
  const c = contacts.get(openId); if (!c || !prepaidSum(c)) return;
  logPrepay(c); change(c, 0);
});
function setStage(c, st){
  if (!c || c.stage === st) return;
  c.log.unshift({id:uid(), at:new Date().toISOString(), type:'Этап', text:`${STAGE[c.stage].name} → ${STAGE[st].name}`});
  c.stage = st; c.stageAt = new Date().toISOString();
  if (st === 'paid') c.paidAt = c.stageAt;
  change(c, 0);
  if (openId === c.id){ refreshDrawerParts(c); const r = $('#payRest'); if (r) r.innerHTML = payRestHTML(c); }
  if (st === 'paid') toast('Оплачено! Отличная работа');
  else if (st === 'prepaid' && !prepaidSum(c)){
    toast('Укажите сумму предоплаты в блоке «Оплата»');
    if (openId === c.id) setTimeout(() => { const f = $('#f-prepay'); if (f){ f.scrollIntoView({block:'center'}); f.focus(); } }, 50);
    else openDrawer(c.id), setTimeout(() => { const f = $('#f-prepay'); if (f){ f.scrollIntoView({block:'center'}); f.focus(); } }, 50);
  }
  else if ((st === 'pause' || st === 'lost') && prepaidSum(c)) toast(`Предоплата ${moneyZ(prepaidSum(c))} сохранена в карточке`);
}

// ---------- модальные окна ----------
function openAdd(){
  $('#modalSlot').innerHTML = `<div class="modal" data-act="closeModal"><form id="addForm" autocomplete="off">
    <h3>Новый <em>клиент</em></h3>
    <p class="lead">Заполните главное. Остальное можно добавить в карточке потом.</p>
    <div class="grid2">
      <label class="fld"><span>Имя *</span><input id="a-name" required placeholder="Анна Петрова"></label>
      <label class="fld"><span>Компания / проект</span><input id="a-company" placeholder="Кофейня «Зерно»"></label>
      <label class="fld"><span>Где общаемся</span><select id="a-channel">${CHANNELS.map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="fld"><span>Ник / телефон / email</span><input id="a-handle" placeholder="@anna_coffee"></label>
      <label class="fld"><span>Этап</span><select id="a-stage">${STAGES.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>Бюджет, ${esc(settings.currency)}</span><input id="a-budget" inputmode="numeric" placeholder="0"></label>
    </div>
    <div class="fld"><span>Услуги</span><div class="chips" id="aSvc">${SERVICES.map(s => `<button type="button" data-svc="${esc(s)}" aria-pressed="false">${esc(s)}</button>`).join('')}</div></div>
    <label class="fld"><span>Первый комментарий</span><textarea id="a-note" rows="2" placeholder="Нашла через рилс, хочет лендинг к открытию"></textarea></label>
    <div class="acts"><button type="button" class="btn" data-act="closeModal">Отмена</button><button class="btn primary" type="submit">Создать</button></div>
  </form></div>`;
  setTimeout(() => $('#a-name').focus(), 0);
}
function closeModal(){ $('#modalSlot').innerHTML = ''; }
function createFromForm(){
  const c = {...blank(), id:uid()};
  c.name = $('#a-name').value.trim(); if (!c.name) return;
  c.company = $('#a-company').value.trim();
  c.channel = $('#a-channel').value;
  c.stage = $('#a-stage').value;
  c.budget = Number($('#a-budget').value.replace(/[^\d.]/g,'')) || 0;
  c.services = [...document.querySelectorAll('#aSvc button[aria-pressed="true"]')].map(b => b.dataset.svc);
  const h = $('#a-handle').value.trim();
  if (h){
    const map = {Telegram:'telegram', WhatsApp:'whatsapp', Instagram:'instagram', VK:'vk', Email:'email', 'Звонок':'phone', 'Сайт / форма':'website'};
    let k = map[c.channel] || (h.includes('@') && h.includes('.') ? 'email' : /^\+?[\d\s()-]{6,}$/.test(h) ? 'phone' : 'telegram');
    if (k === 'phone' || k === 'email') c[k] = h; else c.links[k] = h;
  }
  const note = $('#a-note').value.trim();
  if (note){ c.log.push({id:uid(), at:c.createdAt, type:'Комментарий', channel:c.channel, text:note}); c.lastContactAt = c.createdAt; }
  if (ACTIVE.has(c.stage)){ c.nextDate = addDays(1); c.nextAction = 'Написать ' + (c.stage === 'lead' ? 'первое сообщение' : 'и уточнить детали'); }
  contacts.set(c.id, c);
  store.saveSoon(c.id, 0);
  closeModal(); renderAll(); openDrawer(c.id);
  toast('Клиент добавлен');
}
function showDump(title, text){
  $('#modalSlot').innerHTML = `<div class="modal" data-act="closeModal"><div class="box"><h3>${esc(title)}</h3><p class="lead">Скачивание недоступно в этом окне. Скопируйте текст и сохраните его в файл.</p><textarea class="inp dump" id="dump" readonly>${esc(text)}</textarea><div class="acts"><button class="btn" data-act="closeModal">Закрыть</button><button class="btn primary" data-act="copyDump">Скопировать</button></div></div></div>`;
}
function offer(filename, text){
  try {
    const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json';
    const url = URL.createObjectURL(new Blob([text], {type}));
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Файл скачан: ' + filename);
  } catch(e){ showDump(filename, text); }
}
function exportJson(){ offer(`crm-${today()}.json`, JSON.stringify([...contacts.values()], null, 2)); }
function exportCsv(){
  const cols = ['Имя','Компания','Должность','Этап','Канал','Услуги','Бюджет','Предоплата','Дата предоплаты','Остаток','Телефон','Email','Telegram','WhatsApp','Instagram','VK','Сайт','Теги','Следующий шаг','Дата шага','Последний контакт','Заметки'];
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const rows = [...contacts.values()].map(c => [c.name,c.company,c.position,STAGE[c.stage].name,c.channel,c.services.join(', '),c.budget||'',prepaidSum(c)||'',c.prepayAt||'',c.stage === 'paid' ? 0 : restSum(c),c.phone||c.links.phone||'',c.email||c.links.email||'',c.links.telegram,c.links.whatsapp,c.links.instagram,c.links.vk,c.links.website,c.tags.join(', '),c.nextAction,c.nextDate,(c.lastContactAt||'').slice(0,10),c.notes].map(q).join(';'));
  offer(`crm-${today()}.csv`, '﻿' + [cols.map(q).join(';'), ...rows].join('\r\n'));
}
async function importJson(file){
  try {
    const arr = JSON.parse(await file.text());
    if (!Array.isArray(arr)) throw 0;
    let n = 0;
    for (const raw of arr){ if (!raw || typeof raw !== 'object') continue; const c = norm(raw); c.id = raw.id || uid(); contacts.set(c.id, c); store.saveSoon(c.id, 50 + n*30); n++; }
    renderAll(); toast(`Загружено контактов: ${n}`);
  } catch(e){ toast('Не получилось прочитать файл. Нужен JSON, выгруженный из этой CRM.'); }
}

// ---------- события ----------
fillFilters();
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (!b) return; view = b.dataset.view; try { localStorage.setItem('crm.view', view); } catch(_){} renderAll(); });
$('#q').addEventListener('input', e => { filter.q = e.target.value.trim(); if (view === 'tasks' || view === 'stats') view = 'list'; renderAll(); });
['Service','Channel','Stage'].forEach(k => $('#f'+k).addEventListener('change', e => { filter[k.toLowerCase()] = e.target.value; renderAll(); }));
$('#addBtn').addEventListener('click', openAdd);
$('#currency').addEventListener('change', e => { settings.currency = e.target.value; store.saveSettings(); renderAll(); if (openId) renderDrawer(); });
$('#exportJson').addEventListener('click', exportJson);
$('#exportCsv').addEventListener('click', exportCsv);
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJson(f); e.target.value = ''; });

document.addEventListener('click', e => {
  const t = e.target;
  const thEl = t.closest('th[data-key]');
  if (thEl){ const k = thEl.dataset.key; sort = {key:k, dir: sort.key === k && sort.dir === 'desc' ? 'asc' : 'desc'}; return renderAll(); }
  let act = t.closest('[data-act]');
  if (act && act.classList.contains('modal') && t !== act) act = null;
  if (act){
    const a = act.dataset.act;
    if (a === 'close') return closeDrawer();
    if (a === 'closeModal') return closeModal();
    if (a === 'add') return openAdd();
    if (a === 'copyDump') return copy($('#dump').value, $('#dump'));
    if (a === 'dropExamples'){ [...contacts.values()].filter(c => c.example).forEach(c => store.remove(c.id)); renderAll(); return toast('Примеры удалены'); }
    if (a === 'addLog') return addLog();
    if (a === 'askDel'){ $('#delZone').innerHTML = 'Удалить навсегда? <button class="btn small danger" data-act="del">Да, удалить</button> <button class="btn small" data-act="noDel">Нет</button>'; return; }
    if (a === 'noDel'){ $('#delZone').innerHTML = '<button class="btn small danger" data-act="askDel">Удалить</button>'; return; }
    if (a === 'del'){ const id = openId; closeDrawer(); store.remove(id); renderAll(); return toast('Контакт удалён'); }
  }
  const done = t.closest('[data-done]');
  if (done){
    const c = contacts.get(done.dataset.done);
    c.log.unshift({id:uid(), at:new Date().toISOString(), type:'Комментарий', channel:c.channel, text:'Выполнено: ' + (c.nextAction || 'связался')});
    c.lastContactAt = new Date().toISOString(); c.nextDate = ''; c.nextAction = '';
    change(c, 0); renderAll(); openDrawer(c.id); setTimeout(() => { const f = $('#f-nextAction'); if (f) f.focus(); }, 0);
    return toast('Отмечено. Назначьте следующий шаг');
  }
  const sh = t.closest('[data-shift]');
  if (sh){ const c = contacts.get(sh.dataset.sid); c.nextDate = addDays(Number(sh.dataset.shift), dayDiff(c.nextDate) < 0 ? today() : c.nextDate); change(c, 0); renderAll(); return toast('Перенесено на ' + fmtDay(c.nextDate)); }
  const card = t.closest('.card[data-id], tr[data-id], [data-open]');
  if (card && !openId) return openDrawer(card.dataset.id || card.dataset.open);
  const asv = t.closest('#aSvc button'); if (asv){ asv.setAttribute('aria-pressed', asv.getAttribute('aria-pressed') !== 'true'); return; }
  // внутри карточки клиента
  const c = contacts.get(openId); if (!c) return;
  const st = t.closest('[data-stage-set]'); if (st) return setStage(c, st.dataset.stageSet);
  const sv = t.closest('#svcChips button');
  if (sv){ const s = sv.dataset.svc; c.services = c.services.includes(s) ? c.services.filter(x => x !== s) : [...c.services, s]; sv.setAttribute('aria-pressed', c.services.includes(s)); return change(c); }
  const pp = t.closest('[data-prepay]');
  if (pp){
    const pct = Number(pp.dataset.prepay), b = Number(c.budget) || 0;
    if (pct && !b){ toast('Сначала укажите бюджет'); $('#f-budget').focus(); return; }
    c.prepay = pct ? Math.round(b * pct / 100) : 0;
    c.prepayAt = c.prepay ? (c.prepayAt || today()) : '';
    $('#f-prepay').value = c.prepay || ''; $('#f-prepayAt').value = c.prepayAt;
    $('#payRest').innerHTML = payRestHTML(c);
    if (c.prepay) logPrepay(c);
    return change(c, 0);
  }
  const nx = t.closest('[data-next]');
  if (nx){ c.nextDate = nx.dataset.next === 'clear' ? '' : addDays(Number(nx.dataset.next)); if (nx.dataset.next === 'clear') c.nextAction = ''; $('#f-nextDate').value = c.nextDate; $('#f-nextAction').value = c.nextAction; if (c.nextDate && !c.nextAction) $('#f-nextAction').focus(); return change(c); }
  const cp = t.closest('[data-copy]'); if (cp){ const inp = $('#f-l-' + cp.dataset.copy); if (inp.value) copy(inp.value, inp); else toast('Поле пустое'); return; }
  const dl = t.closest('[data-dellog]'); if (dl){ c.log = c.log.filter(x => x.id !== dl.dataset.dellog); change(c); $('#timeline').innerHTML = timelineHTML(c); return; }
});
document.addEventListener('submit', e => { if (e.target.id === 'addForm'){ e.preventDefault(); createFromForm(); } });

document.addEventListener('input', e => {
  const c = contacts.get(openId); if (!c || !e.target.closest('.drawer')) return;
  const el = e.target;
  if (el.dataset.f){
    const f = el.dataset.f;
    if (f === 'budget' || f === 'prepay'){
      c[f] = Number(el.value.replace(/[^\d.]/g,'')) || 0;
      if (f === 'prepay' && c.prepay && !c.prepayAt){ c.prepayAt = today(); $('#f-prepayAt').value = c.prepayAt; }
      const r = $('#payRest'); if (r) r.innerHTML = payRestHTML(c);
    }
    else if (f === 'tags') c.tags = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else c[f] = el.value;
    if (f === 'name'){ const av = document.querySelector('.d-id .av'); if (av){ av.textContent = initials(c); av.style.setProperty('--avc', avColor(c)); } }
    change(c, f === 'priority' || f === 'channel' || f === 'nextDate' || f === 'prepayAt' ? 0 : 600);
  } else if (el.dataset.l){
    const k = el.dataset.l;
    if (k === 'phone' || k === 'email') c[k] = el.value; else c.links[k] = el.value;
    const a = document.querySelector(`[data-link="${k}"]`);
    if (a){ const l = linkFor(k, el.value); a.href = l || '#'; a.setAttribute('aria-disabled', !l); }
    change(c, 600);
  }
});

function addLog(){
  const c = contacts.get(openId); const ta = $('#logText'); const text = ta ? ta.value.trim() : '';
  if (!c || !text) { if (ta) ta.focus(); return; }
  const now = new Date().toISOString();
  const type = $('#logType').value;
  c.log.unshift({id:uid(), at:now, type, channel:$('#logCh').value, text});
  c.lastContactAt = now;
  if (c.stage === 'lead' && type !== 'Комментарий') setStage(c, 'contact');
  ta.value = ''; $('#timeline').innerHTML = timelineHTML(c); change(c, 0);
}

document.addEventListener('keydown', e => {
  const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === 'Escape'){ if ($('#modalSlot').innerHTML) return closeModal(); if (openId) return closeDrawer(); if (inField) document.activeElement.blur(); }
  if (e.target.id === 'logText' && e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addLog(); }
  if (!store.uid || inField || e.ctrlKey || e.metaKey || e.altKey || openId || $('#modalSlot').innerHTML) return;
  if (e.key === 'n' || e.key === 'N' || e.key === 'т' || e.key === 'Т'){ e.preventDefault(); openAdd(); }
  if (e.key === '/' || e.key === '.'){ e.preventDefault(); $('#q').focus(); }
});

// перетаскивание по воронке
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch(_){} });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop').forEach(x => x.classList.remove('dragging','drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.drop').forEach(x => x !== col && x.classList.remove('drop')); col.classList.add('drop'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault(); setStage(contacts.get(dragId), col.dataset.stage); renderAll(); });

boot();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
